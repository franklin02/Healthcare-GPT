name: Ruff Format

on:
  pull_request:

jobs:
  ruff-format:
    name: Ruff format check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.12.11

      - name: Check formatting
        run: ruff format --check .
