<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthcare Crisis Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Variables ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0c0f;
      --surface:     #111418;
      --surface2:    #181c22;
      --border:      #1e2530;
      --border-hi:   #2a3444;
      --accent:      #00d4aa;
      --accent-dim:  #00d4aa22;
      --accent-glow: #00d4aa44;
      --warn:        #ff6b35;
      --warn-dim:    #ff6b3522;
      --text:        #d4dce8;
      --text-muted:  #5a6a7e;
      --text-dim:    #8899aa;
      --mono:        'IBM Plex Mono', monospace;
      --sans:        'IBM Plex Sans', sans-serif;
      --radius:      4px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ─────────────────────────────────────────────────────── */
    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 960px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--accent-dim) 0%, transparent 60%);
      pointer-events: none;
    }

    .header-left { display: flex; align-items: center; gap: 14px; }

    .logo-mark {
      width: 36px; height: 36px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      flex-shrink: 0;
    }
    .logo-mark svg { width: 18px; height: 18px; }

    .header-title {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    .header-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--mono);
      letter-spacing: 0.04em;
      margin-top: 1px;
    }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border-hi);
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface2);
      transition: all 0.3s;
    }
    .status-pill.ready { border-color: var(--accent); color: var(--accent); }
    .status-pill.error { border-color: var(--warn); color: var(--warn); }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .status-pill.ready .status-dot { animation: blink 2s ease-in-out infinite; }
    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    .record-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* ── Chat Area ──────────────────────────────────────────────────── */
    .chat-area {
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

    /* ── Empty state ─────────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 32px;
      padding: 60px 24px;
      text-align: center;
      animation: fade-in 0.6s ease;
    }
    .empty-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 520px;
    }
    .empty-hint {
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      font-family: var(--mono);
      line-height: 1.5;
    }
    .empty-hint:hover {
      border-color: var(--accent);
      color: var(--text);
      background: var(--accent-dim);
    }
    .empty-hint::before {
      content: '→ ';
      color: var(--accent);
    }
    .empty-title {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Messages ────────────────────────────────────────────────────── */
    .msg { display: flex; gap: 14px; animation: slide-up 0.3s ease; }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 10px; font-weight: 500;
      flex-shrink: 0; margin-top: 2px;
      letter-spacing: 0.04em;
    }
    .msg.user .msg-avatar { background: var(--surface2); border: 1px solid var(--border-hi); color: var(--text-dim); }
    .msg.ai   .msg-avatar { background: var(--accent); color: var(--bg); }

    .msg-body { flex: 1; min-width: 0; }

    .msg-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .msg-text {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .msg-text {
      background: var(--surface2);
      border-color: var(--border-hi);
      color: var(--text-dim);
    }
    .msg.ai .msg-text { border-left: 2px solid var(--accent); }

    /* ── Thinking indicator ──────────────────────────────────────────── */
    .thinking .msg-text {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
    }
    .dots { display: flex; gap: 4px; }
    .dots span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ── Error message ───────────────────────────────────────────────── */
    .msg.error .msg-text {
      border-color: var(--warn);
      border-left: 2px solid var(--warn);
      color: var(--warn);
      font-family: var(--mono);
      font-size: 12px;
    }

    /* ── Input bar ───────────────────────────────────────────────────── */
    .input-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-wrap {
      flex: 1;
      position: relative;
      background: var(--surface2);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }

    #question {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13.5px;
      padding: 12px 14px;
      resize: none;
      min-height: 46px;
      max-height: 140px;
      line-height: 1.5;
    }
    #question::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 46px; height: 46px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .send-btn:hover { background: #00ffcc; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: var(--border-hi); cursor: not-allowed; }
    .send-btn svg { color: var(--bg); }

    @keyframes fade-in {
      from { opacity: 0; } to { opacity: 1; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- ── Header ─────────────────────────────────────────────────────── -->
  <header>
    <div class="header-left">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0a0c0f" stroke-width="2.5" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <div class="header-title">Healthcare Crisis Intelligence</div>
        <div class="header-sub">RAG · Local LLM · ChromaDB</div>
      </div>
    </div>
    <div class="header-right">
      <div class="record-count" id="recordCount">—</div>
      <div class="status-pill" id="statusPill">
        <div class="status-dot"></div>
        <span id="statusText">connecting…</span>
      </div>
    </div>
  </header>

  <!-- ── Chat Area ──────────────────────────────────────────────────── -->
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-title">Ask about healthcare incidents</div>
      <div class="empty-grid">
        <div class="empty-hint" onclick="fillQuestion(this)">What hospitals were hit by ransomware recently?</div>
        <div class="empty-hint" onclick="fillQuestion(this)">Which incidents caused the most patient disruption?</div>
        <div class="empty-hint" onclick="fillQuestion(this)">What is the most recent cyber attack on a hospital?</div>
        <div class="empty-hint" onclick="fillQuestion(this)">Are there any cyber attacks with casualties?</div>
      </div>
    </div>
  </div>

  <!-- ── Input ──────────────────────────────────────────────────────── -->
  <div>
    <div class="input-bar">
      <div class="input-wrap">
        <textarea
          id="question"
          placeholder="Ask about cyberattacks, hospital disruptions, and healthcare incidents…"
          rows="1"
        ></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send (Enter)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div><!-- /shell -->

<script>
  // ── Status check ──────────────────────────────────────────────────────────
  async function checkStatus() {
    try {
      const r  = await fetch('/status');
      const d  = await r.json();
      const pill = document.getElementById('statusPill');
      const txt  = document.getElementById('statusText');
      const cnt  = document.getElementById('recordCount');

      if (d.db_ready) {
        pill.classList.add('ready');
        txt.textContent = 'ready';
        cnt.textContent = `${d.records_indexed.toLocaleString()} records indexed`;
      } else {
        pill.classList.add('error');
        txt.textContent = 'no index';
        cnt.textContent = 'run ingest.py first';
      }
    } catch {
      const pill = document.getElementById('statusPill');
      const txt  = document.getElementById('statusText');
      pill.classList.add('error');
      txt.textContent = 'offline';
    }
  }
  checkStatus();

  // ── Auto-resize textarea ──────────────────────────────────────────────────
  const textarea = document.getElementById('question');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
  });
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Fill from example hints ───────────────────────────────────────────────
  function fillQuestion(el) {
    textarea.value = el.textContent.replace(/^→ /, '').trim();
    textarea.focus();
  }

  function addMessage(role, content) {
    const area = document.getElementById('chatArea');
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const isAI = role === 'ai';

    div.innerHTML = `
      <div class="msg-avatar">${isAI ? 'AI' : 'YOU'}</div>
      <div class="msg-body">
        <div class="msg-label">${isAI ? 'Intelligence System' : 'Query'}</div>
        <div class="msg-text">${content}</div>
      </div>`;

    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    return div;
  }

  function addThinking() {
    const area = document.getElementById('chatArea');
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className = 'msg ai thinking';
    div.id = 'thinking';
    div.innerHTML = `
      <div class="msg-avatar">AI</div>
      <div class="msg-body">
        <div class="msg-label">Intelligence System</div>
        <div class="msg-text">
          <div class="dots">
            <span></span><span></span><span></span>
          </div>
          Retrieving records & generating response…
        </div>
      </div>`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  // ── Main send ─────────────────────────────────────────────────────────────
  async function sendMessage() {
    const q   = textarea.value.trim();
    const btn = document.getElementById('sendBtn');
    if (!q) return;

    textarea.value = '';
    textarea.style.height = 'auto';
    btn.disabled = true;

    addMessage('user', q);
    addThinking();

    try {
      const res  = await fetch('/chat', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ question: q }),
      });

      document.getElementById('thinking')?.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        addMessage('error', `⚠ ${err.detail || 'Unknown error'}`);
      } else {
        const data = await res.json();
        addMessage('ai', data.answer);
      }
    } catch (e) {
      document.getElementById('thinking')?.remove();
      addMessage('error', `⚠ Could not reach the server.\nMake sure uvicorn is running:\n  uvicorn main:app --reload`);
    }

    btn.disabled = false;
    textarea.focus();
  }
</script>
</body>
</html>
